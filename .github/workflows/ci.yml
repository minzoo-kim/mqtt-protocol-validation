name: MQTT validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Start Mosquitto
        run: docker compose up -d --wait

      - name: Run unit and integration tests
        env:
          MQTT_INTEGRATION: "1"
        run: pytest --cov=mqtt_validator --cov-report=term-missing --cov-fail-under=80

      - name: Run YAML validation suite
        run: python -m mqtt_validator run scenarios/mvp.yaml --output-dir reports

      - name: Show broker logs on failure
        if: failure()
        run: docker compose logs --no-color mosquitto

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-validation-reports
          path: reports/
          if-no-files-found: warn

      - name: Stop Mosquitto
        if: always()
        run: docker compose down -v
