name: MQTT validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Start Mosquitto and Toxiproxy
        run: docker compose up -d --wait

      - name: Run unit and integration tests
        env:
          MQTT_INTEGRATION: "1"
        run: pytest --cov=mqtt_validator --cov-report=term-missing --cov-fail-under=80

      - name: Run YAML validation suite
        run: python -m mqtt_validator run scenarios/mvp.yaml --output-dir reports

      - name: Run resilience validation suite
        run: python -m mqtt_validator run scenarios/resilience.yaml --output-dir reports

      - name: Show broker logs on failure
        if: failure()
        run: docker compose logs --no-color mosquitto toxiproxy

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mqtt-validation-reports
          path: reports/
          if-no-files-found: warn

      - name: Stop Mosquitto
        if: always()
        run: docker compose down -v
