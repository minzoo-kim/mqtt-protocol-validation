services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-validator-broker
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t validator/health -m ok -q 0"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: mqtt-validator-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:1884:1884"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
