version: 1
suite:
  name: Intentional failure reproduction
  description: A deterministic red test used to demonstrate failure evidence and reporting
broker:
  host: 127.0.0.1
  port: 1883
  keepalive: 30
scenarios:
  - id: TC-MQTT-FAIL-001
    requirement_id: REQ-MQTT-QOS1
    name: Intentional payload mismatch for report demonstration
    kind: publish_receive
    topic: validator/{run_id}/failure-demo
    qos: 1
    subscribe_qos: 1
    timeout_s: 2.0
    payload:
      message_id: actual-{run_id}
      value: 999
    expected:
      received_count: 1
      delivered_qos: 2
      payload_matches: true
